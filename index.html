              2. MEMBER MANAGEMENT MODULE
          ============================================================== */}
          {activeTab === 'members' && (
            <div className={`p-6 rounded-[26px] border ${cardBg}`}>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div className="flex flex-col sm:flex-row gap-3 flex-1">
                  <div className="relative flex-1 max-w-md">
                    <Search size={17} className={`absolute left-3.5 top-1/2 -translate-y-1/2 ${mutedText}`} />
                    <input
                      type="text"
                      placeholder="নাম, পদবী বা মোবাইল নম্বর খুঁজুন..."
                      value={memberSearch}
                      onChange={(e) => setMemberSearch(e.target.value)}
                      className={`w-full pl-10 pr-4 py-2.5 rounded-xl border text-sm outline-none ${inputBg}`}
                    />
                  </div>
                  <select
                    value={memberFilter}
                    onChange={(e) => setMemberFilter(e.target.value)}
                    className={`px-4 py-2.5 rounded-xl border text-sm outline-none ${inputBg}`}
                  >
                    <option value="সব">সকল স্ট্যাটাস</option>
                    <option value="সক্রিয়">সক্রিয়</option>
                    <option value="অপেক্ষমান">অপেক্ষমান</option>
                  </select>
                </div>

                <button
                  onClick={openAddMember}
                  className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-[#087F5B] hover:bg-[#06694b] text-white text-sm font-semibold transition-colors"
                >
                  <Plus size={18} />
                  <span>নতুন সদস্য যোগ করুন</span>
                </button>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className={`border-b text-xs uppercase ${darkMode ? 'border-white/10 text-white/60' : 'border-black/5 text-[#858B93]'}`}>
                      <th className="py-3.5 px-4">সদস্য ও আইডি</th>
                      <th className="py-3.5 px-4">পদবী</th>
                      <th className="py-3.5 px-4">রক্তের গ্রুপ</th>
                      <th className="py-3.5 px-4">মোবাইল</th>
                      <th className="py-3.5 px-4">স্ট্যাটাস</th>
                      <th className="py-3.5 px-4 text-right">অ্যাকশন</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-black/[0.04] text-sm">
                    {filteredMembers.map((mem) => (
                      <tr key={mem.id} className="hover:bg-black/[0.02] transition-colors">
                        <td className="py-3.5 px-4">
                          <div className="font-bold">{mem.name}</div>
                          <div className={`text-xs ${mutedText}`}>{mem.id} • {mem.profession}</div>
                        </td>
                        <td className="py-3.5 px-4 font-medium">{mem.role}</td>
                        <td className="py-3.5 px-4">
                          <span className="px-2.5 py-1 rounded-lg bg-[#087F5B]/10 text-[#087F5B] font-bold text-xs">
                            {mem.bloodGroup}
                          </span>
                        </td>
                        <td className="py-3.5 px-4">{mem.phone}</td>
                        <td className="py-3.5 px-4">
                          <span
                            className={`px-3 py-1 rounded-full text-xs font-semibold ${
                              mem.status === 'সক্রিয়'
                                ? 'bg-[#087F5B]/15 text-[#087F5B]'
                                : 'bg-[#101D35]/10 text-[#101D35]'
                            }`}
                          >
                            {mem.status}
                          </span>
                        </td>
                        <td className="py-3.5 px-4 text-right space-x-2">
                          <button
                            onClick={() => openEditMember(mem)}
                            className="p-2 rounded-lg hover:bg-[#087F5B]/10 text-[#087F5B] transition-colors"
                            title="সম্পাদনা"
                          >
                            <Edit3 size={16} />
                          </button>
                          <button
                            onClick={() => handleDeleteMember(mem.id)}
                            className="p-2 rounded-lg hover:bg-black/10 text-[#858B93] hover:text-[#17191C] transition-colors"
                            title="মুছে ফেলুন"
                          >
                            <Trash2 size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ==============================================================
              3. ACTIVITIES MANAGEMENT MODULE
          ============================================================== */}
          {activeTab === 'activities' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <p className={`text-sm ${mutedText}`}>মোট {activities.length}টি কার্যক্রম ওয়েবসাইটে প্রদর্শিত হচ্ছে</p>
                <button
                  onClick={() => {
                    setEditingActivity(null);
                    setActivityForm({
                      title: '',
                      category: 'মানবিক সেবা',
                      iconName: 'HeartHandshake',
                      date: 'চলমান কার্যক্রম',
                      description: '',
                      image: 'https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&q=80&w=1000'
                    });
                    setShowActivityModal(true);
                  }}
                  className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#087F5B] text-white text-sm font-semibold"
                >
                  <Plus size={18} />
                  <span>নতুন কার্যক্রম যোগ করুন</span>
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {activities.map((act) => (
                  <div key={act.id} className={`rounded-[24px] border overflow-hidden flex flex-col justify-between ${cardBg}`}>
                    <div>
                      <img src={act.image} alt={act.title} className="w-full h-44 object-cover" />
                      <div className="p-5">
                        <span className="text-xs font-semibold text-[#087F5B]">{act.category}</span>
                        <h3 className="text-lg font-bold mt-1 mb-2">{act.title}</h3>
                        <p className={`text-xs leading-relaxed ${mutedText}`}>{act.description}</p>
                      </div>
                    </div>
                    <div className="px-5 py-3.5 border-t border-black/[0.05] flex justify-end gap-2">
                      <button
                        onClick={() => {
                          setEditingActivity(act);
                          setActivityForm(act);
                          setShowActivityModal(true);
                        }}
                        className="px-3 py-1.5 rounded-lg bg-[#087F5B]/10 text-[#087F5B] text-xs font-semibold"
                      >
                        সম্পাদনা
                      </button>
                      <button
                        onClick={() => {
                          setActivities(activities.filter((a) => a.id !== act.id));
                          showToast('কার্যক্রম মুছে ফেলা হয়েছে');
                        }}
                        className="px-3 py-1.5 rounded-lg bg-black/5 text-[#858B93] text-xs font-semibold"
                      >
                        মুছুন
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ==============================================================
              4. NOTICE MANAGEMENT MODULE
          ============================================================== */}
          {activeTab === 'notices' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <p className={`text-sm ${mutedText}`}>নোটিশ তৈরি, সম্পাদনা এবং প্রকাশ নিয়ন্ত্রণ করুন</p>
                <button
                  onClick={() => {
                    setEditingNotice(null);
                    setNoticeForm({
                      title: '',
                      category: 'জরুরি ঘোষণা',
                      date: '১৮ নভেম্বর, ২০২৬',
                      summary: '',
                      content: '',
                      published: true
                    });
                    setShowNoticeModal(true);
                  }}
                  className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#087F5B] text-white text-sm font-semibold"
                >
                  <Plus size={18} />
                  <span>নতুন নোটিশ প্রকাশ করুন</span>
                </button>
              </div>

              <div className="space-y-4">
                {notices.map((not) => (
                  <div
                    key={not.id}
                    className={`p-6 rounded-[24px] border flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${cardBg}`}
                  >
                    <div className="max-w-2xl">
                      <div className="flex items-center gap-2.5 mb-2">
                        <span className="px-3 py-0.5 rounded-full bg-[#087F5B]/10 text-[#087F5B] text-xs font-semibold">
                          {not.category}
                        </span>
                        <span className={`text-xs ${mutedText}`}>{not.date}</span>
                        <span
                          className={`px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                            not.published ? 'bg-[#087F5B] text-white' : 'bg-[#858B93]/20 text-[#858B93]'
                          }`}
                        >
                          {not.published ? 'প্রকাশিত' : 'অপ্রকাশিত'}
                        </span>
                      </div>
                      <h3 className="text-lg font-bold mb-1">{not.title}</h3>
                      <p className={`text-sm ${mutedText}`}>{not.summary}</p>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => {
                          setNotices(
                            notices.map((n) => (n.id === not.id ? { ...n, published: !n.published } : n))
                          );
                          showToast(not.published ? 'নোটিশ অপ্রকাশিত করা হয়েছে' : 'নোটিশ প্রকাশিত হয়েছে');
                        }}
                        className="p-2.5 rounded-xl bg-[#F5F6F7] text-[#101D35] hover:bg-[#e9ecef]"
                        title={not.published ? 'অপ্রকাশিত করুন' : 'প্রকাশ করুন'}
                      >
                        {not.published ? <EyeOff size={17} /> : <Eye size={17} />}
                      </button>
                      <button
                        onClick={() => {
                          setEditingNotice(not);
                          setNoticeForm(not);
                          setShowNoticeModal(true);
                        }}
                        className="p-2.5 rounded-xl bg-[#087F5B]/10 text-[#087F5B]"
                      >
                        <Edit3 size={17} />
                      </button>
                      <button
                        onClick={() => {
                          setNotices(notices.filter((n) => n.id !== not.id));
                          showToast('নোটিশ মুছে ফেলা হয়েছে');
                        }}
                        className="p-2.5 rounded-xl bg-black/5 text-[#858B93]"
                      >
                        <Trash2 size={17} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ==============================================================
              5. GALLERY MANAGEMENT MODULE
          ============================================================== */}
          {activeTab === 'gallery' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <p className={`text-sm ${mutedText}`}>গ্যালারিতে মোট {gallery.length}টি ছবি রয়েছে</p>
                <button
                  onClick={() => setShowGalleryModal(true)}
                  className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#087F5B] text-white text-sm font-semibold"
                >
                  <Plus size={18} />
                  <span>নতুন ছবি যুক্ত করুন</span>
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {gallery.map((img) => (
                  <div key={img.id} className={`rounded-[22px] border overflow-hidden ${cardBg}`}>
                    <img src={img.url} alt={img.title} className="w-full h-44 object-cover" />
                    <div className="p-4">
                      <span className="text-[11px] font-semibold text-[#087F5B]">{img.category}</span>
                      <h4 className="text-sm font-bold mt-1 line-clamp-1">{img.title}</h4>
                      <div className="mt-3 pt-3 border-t border-black/[0.05] flex justify-between items-center">
                        <span className={`text-xs ${mutedText}`}>{img.date}</span>
                        <button
                          onClick={() => {
                            setGallery(gallery.filter((g) => g.id !== img.id));
                            showToast('ছবি গ্যালারি থেকে মুছে ফেলা হয়েছে');
                          }}
                          className="text-xs font-semibold text-[#858B93] hover:text-[#17191C]"
                        >
                          মুছুন
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ==============================================================
              6. VOLUNTEER APPLICATIONS MODULE
          ============================================================== */}
          {activeTab === 'applications' && (
            <div className="space-y-4">
              {applications.map((app) => (
                <div
                  key={app.id}
                  className={`p-6 rounded-[24px] border flex flex-col lg:flex-row lg:items-center justify-between gap-6 ${cardBg}`}
                >
                  <div className="space-y-2 max-w-2xl">
                    <div className="flex flex-wrap items-center gap-3">
                      <h3 className="text-lg font-bold">{app.fullName}</h3>
                      <span className="px-3 py-0.5 rounded-full bg-[#087F5B]/10 text-[#087F5B] text-xs font-semibold">
                        {app.interest}
                      </span>
                      <span className={`text-xs ${mutedText}`}>আবেদনের তারিখ: {app.appliedAt}</span>
                    </div>
                    <p className={`text-sm ${mutedText}`}>
                      মোবাইল: <strong>{app.phone}</strong> • পেশা: {app.profession} • ঠিকানা: {app.address}
                    </p>
                    {app.bio && (
                      <p className={`text-sm p-3 rounded-xl ${darkMode ? 'bg-white/5' : 'bg-[#F5F6F7]'}`}>
                        “{app.bio}”
                      </p>
                    )}
                  </div>

                  <div className="flex items-center gap-3 shrink-0">
                    {app.status === 'pending' ? (
                      <>
                        <button
                          onClick={() => handleApplicationStatus(app, 'approved')}
                          className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-[#087F5B] text-white text-sm font-semibold hover:bg-[#06694b]"
                        >
                          <Check size={16} />
                          <span>অনুমোদন করুন</span>
                        </button>
                        <button
                          onClick={() => handleApplicationStatus(app, 'rejected')}
                          className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-black/5 text-[#858B93] text-sm font-semibold hover:text-[#17191C]"
                        >
                          <XCircle size={16} />
                          <span>বাতিল</span>
                        </button>
                      </>
                    ) : (
                      <span
                        className={`px-4 py-2 rounded-xl text-xs font-bold ${
                          app.status === 'approved'
                            ? 'bg-[#087F5B]/15 text-[#087F5B]'
                            : 'bg-black/10 text-[#858B93]'
                        }`}
                      >
                        {app.status === 'approved' ? 'অনুমোদিত ও সদস্যভুক্ত' : 'বাতিলকৃত'}
                      </span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ==============================================================
              7. WEBSITE SETTINGS MODULE
          ============================================================== */}
          {activeTab === 'settings' && (
            <div className={`p-6 sm:p-8 rounded-[26px] border ${cardBg}`}>
              <h3 className="text-xl font-bold mb-6">সংগঠনের তথ্য ও ওয়েবসাইট সেটিংস</h3>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  showToast('ওয়েবসাইট সেটিংস সফলভাবে সংরক্ষণ করা হয়েছে!');
                }}
                className="space-y-5 max-w-3xl"
              >
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-sm font-semibold mb-1.5">সংগঠনের নাম (বাংলা)</label>
                    <input
                      type="text"
                      value={orgSettings.nameBn}
                      onChange={(e) => setOrgSettings({ ...orgSettings, nameBn: e.target.value })}
                      className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-1.5">সংগঠনের নাম (ইংরেজি)</label>
                    <input
                      type="text"
                      value={orgSettings.nameEn}
                      onChange={(e) => setOrgSettings({ ...orgSettings, nameEn: e.target.value })}
                      className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-sm font-semibold mb-1.5">ফোন নম্বর</label>
                    <input
                      type="text"
                      value={orgSettings.phone}
                      onChange={(e) => setOrgSettings({ ...orgSettings, phone: e.target.value })}
                      className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-1.5">ইমেইল ঠিকানা</label>
                    <input
                      type="email"
                      value={orgSettings.email}
                      onChange={(e) => setOrgSettings({ ...orgSettings, email: e.target.value })}
                      className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold mb-1.5">কার্যালয়ের ঠিকানা</label>
                  <input
                    type="text"
                    value={orgSettings.address}
                    onChange={(e) => setOrgSettings({ ...orgSettings, address: e.target.value })}
                    className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold mb-1.5">মূল স্লোগান (Tagline)</label>
                  <input
                    type="text"
                    value={orgSettings.tagline}
                    onChange={(e) => setOrgSettings({ ...orgSettings, tagline: e.target.value })}
                    className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold mb-1.5">হোম পেজের প্রধান ছবি (Hero)</label>
                  <img src={orgSettings.heroImage} alt="" className="w-full h-40 object-cover rounded-xl mb-2" />
                  <ImagePicker label="নতুন প্রধান ছবি আপলোড করুন" showToast={showToast} onPick={(u) => setOrgSettings({ ...orgSettings, heroImage: u })} />
                </div>

                <div>
                  <label className="block text-sm font-semibold mb-1.5">আমাদের পরিচয় ও ইতিহাস</label>
                  <textarea
                    rows={3}
                    value={orgSettings.aboutHistory}
                    onChange={(e) => setOrgSettings({ ...orgSettings, aboutHistory: e.target.value })}
                    className={`w-full px-4 py-3 rounded-xl border text-sm outline-none ${inputBg}`}
                  />
                </div>

                <button
                  type="submit"
                  className="px-7 py-3.5 rounded-xl bg-[#087F5B] hover:bg-[#06694b] text-white font-semibold text-sm transition-colors"
                >
                  পরিবর্তনসমূহ সংরক্ষণ করুন
                </button>
              </form>
            </div>
          )}
        </main>
      </div>

      {/* ====================================================================
          ADMIN MODALS (MEMBER, ACTIVITY, NOTICE, GALLERY)
      ==================================================================== */}
      {showMemberModal && (
        <div className="fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`w-full max-w-lg rounded-[26px] p-7 border shadow-2xl ${cardBg}`}>
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-xl font-bold">{editingMember ? 'সদস্য তথ্য সম্পাদনা' : 'নতুন সদস্য যুক্ত করুন'}</h3>
              <button onClick={() => setShowMemberModal(false)}><X size={20} /></button>
            </div>
            <form onSubmit={handleSaveMember} className="space-y-4">
              <input
                type="text"
                required
                placeholder="পূর্ণ নাম"
                value={memberForm.name}
                onChange={(e) => setMemberForm({ ...memberForm, name: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <div className="grid grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="পদবী (যেমন: সাধারণ সদস্য)"
                  value={memberForm.role}
                  onChange={(e) => setMemberForm({ ...memberForm, role: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
                <select
                  value={memberForm.bloodGroup}
                  onChange={(e) => setMemberForm({ ...memberForm, bloodGroup: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                >
                  {['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'].map((bg) => (
                    <option key={bg} value={bg}>{bg}</option>
                  ))}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="মোবাইল নম্বর"
                  value={memberForm.phone}
                  onChange={(e) => setMemberForm({ ...memberForm, phone: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
                <input
                  type="text"
                  required
                  placeholder="পেশা"
                  value={memberForm.profession}
                  onChange={(e) => setMemberForm({ ...memberForm, profession: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
              </div>
              <select
                value={memberForm.status}
                onChange={(e) => setMemberForm({ ...memberForm, status: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              >
                <option value="সক্রিয়">সক্রিয়</option>
                <option value="অপেক্ষমান">অপেক্ষমান</option>
              </select>
              <button type="submit" className="w-full py-3.5 rounded-xl bg-[#087F5B] text-white font-semibold text-sm">
                সংরক্ষণ করুন
              </button>
            </form>
          </div>
        </div>
      )}

      {showActivityModal && (
        <div className="fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`w-full max-w-lg rounded-[26px] p-7 border shadow-2xl ${cardBg}`}>
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-xl font-bold">{editingActivity ? 'কার্যক্রম সম্পাদনা' : 'নতুন কার্যক্রম'}</h3>
              <button onClick={() => setShowActivityModal(false)}><X size={20} /></button>
            </div>
            <form onSubmit={handleSaveActivity} className="space-y-4">
              <input
                type="text"
                required
                placeholder="কার্যক্রমের শিরোনাম"
                value={activityForm.title}
                onChange={(e) => setActivityForm({ ...activityForm, title: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <div className="grid grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="ক্যাটাগরি"
                  value={activityForm.category}
                  onChange={(e) => setActivityForm({ ...activityForm, category: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
                <input
                  type="text"
                  required
                  placeholder="সময়কাল"
                  value={activityForm.date}
                  onChange={(e) => setActivityForm({ ...activityForm, date: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
              </div>
              <input
                type="text"
                required
                placeholder="ছবির লিংক (URL) অথবা নিচে থেকে আপলোড করুন"
                value={activityForm.image && activityForm.image.startsWith('data:') ? '(আপলোড করা ছবি)' : activityForm.image}
                onChange={(e) => setActivityForm({ ...activityForm, image: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <ImagePicker showToast={showToast} onPick={(u) => setActivityForm({ ...activityForm, image: u })} />
              {activityForm.image && <img src={activityForm.image} alt="" className="w-full h-32 object-cover rounded-xl" />}
              <textarea
                rows={3}
                required
                placeholder="বিস্তারিত বিবরণ"
                value={activityForm.description}
                onChange={(e) => setActivityForm({ ...activityForm, description: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <button type="submit" className="w-full py-3.5 rounded-xl bg-[#087F5B] text-white font-semibold text-sm">
                সংরক্ষণ করুন
              </button>
            </form>
          </div>
        </div>
      )}

      {showNoticeModal && (
        <div className="fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`w-full max-w-lg rounded-[26px] p-7 border shadow-2xl ${cardBg}`}>
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-xl font-bold">{editingNotice ? 'নোটিশ সম্পাদনা' : 'নতুন নোটিশ তৈরি'}</h3>
              <button onClick={() => setShowNoticeModal(false)}><X size={20} /></button>
            </div>
            <form onSubmit={handleSaveNotice} className="space-y-4">
              <input
                type="text"
                required
                placeholder="নোটিশের শিরোনাম"
                value={noticeForm.title}
                onChange={(e) => setNoticeForm({ ...noticeForm, title: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <div className="grid grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="ক্যাটাগরি"
                  value={noticeForm.category}
                  onChange={(e) => setNoticeForm({ ...noticeForm, category: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
                <input
                  type="text"
                  required
                  placeholder="তারিখ"
                  value={noticeForm.date}
                  onChange={(e) => setNoticeForm({ ...noticeForm, date: e.target.value })}
                  className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
                />
              </div>
              <input
                type="text"
                required
                placeholder="সংক্ষিপ্ত সারসংক্ষেপ"
                value={noticeForm.summary}
                onChange={(e) => setNoticeForm({ ...noticeForm, summary: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <textarea
                rows={4}
                required
                placeholder="বিস্তারিত নোটিশ"
                value={noticeForm.content}
                onChange={(e) => setNoticeForm({ ...noticeForm, content: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <button type="submit" className="w-full py-3.5 rounded-xl bg-[#087F5B] text-white font-semibold text-sm">
                নোটিশ সংরক্ষণ করুন
              </button>
            </form>
          </div>
        </div>
      )}

      {showGalleryModal && (
        <div className="fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`w-full max-w-lg rounded-[26px] p-7 border shadow-2xl ${cardBg}`}>
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-xl font-bold">গ্যালারিতে নতুন ছবি যুক্ত করুন</h3>
              <button onClick={() => setShowGalleryModal(false)}><X size={20} /></button>
            </div>
            <form
              onSubmit={(e) => {
                e.preventDefault();
                setGallery([{ ...galleryForm, id: `gal-${Date.now()}` }, ...gallery]);
                setShowGalleryModal(false);
                showToast('নতুন ছবি গ্যালারিতে যুক্ত হয়েছে');
              }}
              className="space-y-4"
            >
              <input
                type="text"
                required
                placeholder="ছবির ক্যাপশন / শিরোনাম"
                value={galleryForm.title}
                onChange={(e) => setGalleryForm({ ...galleryForm, title: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <select
                value={galleryForm.category}
                onChange={(e) => setGalleryForm({ ...galleryForm, category: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              >
                {['সামাজিক কার্যক্রম', 'রক্তদান', 'খেলাধুলা', 'অনুষ্ঠান', 'অন্যান্য'].map((c) => (
                  <option key={c} value={c}>{c}</option>
                ))}
              </select>
              <input
                type="text"
                required
                placeholder="ছবির লিংক (URL) অথবা নিচে থেকে আপলোড করুন"
                value={galleryForm.url && galleryForm.url.startsWith('data:') ? '(আপলোড করা ছবি)' : galleryForm.url}
                onChange={(e) => setGalleryForm({ ...galleryForm, url: e.target.value })}
                className={`w-full px-4 py-3 rounded-xl border text-sm ${inputBg}`}
              />
              <ImagePicker showToast={showToast} onPick={(u) => setGalleryForm({ ...galleryForm, url: u })} />
              {galleryForm.url && <img src={galleryForm.url} alt="" className="w-full h-32 object-cover rounded-xl" />}
              <button type="submit" className="w-full py-3.5 rounded-xl bg-[#087F5B] text-white font-semibold text-sm">
                গ্যালারিতে যুক্ত করুন
              </button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
