// Intersection Observer Hook for Scroll Reveal Animations
const useScrollReveal = (threshold = 0.12) => {
  const [isVisible, setIsVisible] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setIsVisible(true);
          observer.unobserve(entry.target);
        }
      },
      { threshold }
    );
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [threshold]);

  return [ref, isVisible];
};

const RevealSection = ({ children, className = '', delay = 0 }) => {
  const [ref, isVisible] = useScrollReveal();
  return (
    <div
      ref={ref}
      style={{ transitionDelay: `${delay}ms` }}
      className={`transition-all duration-700 ease-out ${
        isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'
      } ${className}`}
    >
      {children}
    </div>
  );
};

// Animated Counter Component
const AnimatedCounter = ({ end, suffix = '', prefix = '' }) => {
  const [count, setCount] = useState(0);
  const [ref, isVisible] = useScrollReveal(0.2);

  useEffect(() => {
    if (!isVisible) return;
    let start = 0;
    const duration = 1400;
    const increment = end / (duration / 16);
    const timer = setInterval(() => {
      start += increment;
      if (start >= end) {
        setCount(end);
        clearInterval(timer);
      } else {
        setCount(Math.floor(start));
      }
    }, 16);
    return () => clearInterval(timer);
  }, [isVisible, end]);

  // Convert English digits to Bengali digits
  const toBengaliDigits = (num) => {
    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().replace(/\d/g, (d) => bnDigits[d]);
  };

  return (
    <span ref={ref}>
      {prefix}{toBengaliDigits(count)}{suffix}
    </span>
  );
};

async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return btoa(unescape(encodeURIComponent(s))); }
}
async function userRequest(action, d) {
  if (APPS_SCRIPT_URL) {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'user_' + action, ...d }) });
    return await res.json();
  }
  if (action === 'forgot' || action === 'reset') return { ok: false, message: 'পাসওয়ার্ড রিসেট করতে সার্ভার সংযোগ (APPS_SCRIPT_URL) প্রয়োজন।' };
  let users = [];
  try { users = JSON.parse(localStorage.getItem('nag_users') || '[]'); } catch (e) {}
  const email = d.email.trim().toLowerCase();
  const h = await sha(email + '|' + d.password);
  if (action === 'signup') {
    if (users.some((u) => u.email === email)) return { ok: false, message: 'এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে' };
    users.push({ email, name: d.name, phone: d.phone, h });
    try { localStorage.setItem('nag_users', JSON.stringify(users)); } catch (e) {}
    return { ok: true, name: d.name };
  }
  const u = users.find((x) => x.email === email && x.h === h);
  return u ? { ok: true, name: u.name } : { ok: false, message: 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।' };
}

// Google Apps Script Web App URL (শেষে /exec দিয়ে). বসালে লগইন Google Sheet থেকে যাচাই হবে
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNh1sweRZ-WOfrM1hKFHehe0QIWyuintDg2K9BEhSLek_b6LSDxJ1Y1qOQV-dUqCPfSg/exec';

// ---------- Live content sync + image upload (auto-save to server) ----------
const CONTENT_CACHE_KEY = 'nag_content_cache_v1';
const CONTENT_DIRTY_KEY = 'nag_content_dirty_v1';
async function apiPost(payload) {
  const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return res.json();
}
function compressImage(file, maxW = 1400, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function uploadImage(file) {
  const dataUrl = await compressImage(file);
  const auth = window.__adminAuth;
  if (APPS_SCRIPT_URL && auth) {
    try {
      const r = await apiPost({ action: 'content_upload', email: auth.email, password: auth.password, mime: 'image/jpeg', name: 'img_' + Date.now() + '.jpg', data: dataUrl.split(',')[1] });
      if (r && r.ok && r.url) return r.url;
    } catch (e) {}
  }
  return dataUrl; // fallback: image is stored inside the saved content itself
}
function ImagePicker({ onPick, showToast, label = 'ডিভাইস থেকে ছবি আপলোড করুন' }) {

    catch (err) { showToast && showToast('ছবি আপলোড করা যায়নি', 'error'); }

function App() {
  // Navigation & View State ('public' or 'admin')
  const [viewMode, setViewMode] = useState('public');
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
  const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
  const [adminCredentials, setAdminCredentials] = useState({ email: '', password: '' });
  const [loginError, setLoginError] = useState('');

  // Central Managed State (Syncs seamlessly between Public Site & Admin Dashboard)
  const [orgSettings, setOrgSettings] = useState(INITIAL_ORG_SETTINGS);
  const [activities, setActivities] = useState(INITIAL_ACTIVITIES);
  const [gallery, setGallery] = useState(INITIAL_GALLERY);
  const [notices, setNotices] = useState(INITIAL_NOTICES);
  const [members, setMembers] = useState(INITIAL_MEMBERS);
  const [applications, setApplications] = useState(INITIAL_APPLICATIONS);
  const [contactMessages, setContactMessages] = useState([]);

  // ---- Live content: load for everyone, auto-save when admin edits ----
  const [contentReady, setContentReady] = useState(false);
  const lastSynced = useRef('');
  const snapshot = (o, a, g, n, m) => JSON.stringify({ o, a, g, n, m });
  const applyContent = (c) => {
    const o = { ...INITIAL_ORG_SETTINGS, ...(c.orgSettings || {}) };
    const a = Array.isArray(c.activities) ? c.activities : INITIAL_ACTIVITIES;
    const g = Array.isArray(c.gallery) ? c.gallery : INITIAL_GALLERY;
    const n = Array.isArray(c.notices) ? c.notices : INITIAL_NOTICES;
    const m = Array.isArray(c.members) ? c.members : INITIAL_MEMBERS;
    setOrgSettings(o); setActivities(a); setGallery(g); setNotices(n); setMembers(m);
    lastSynced.current = snapshot(o, a, g, n, m);
  };
  useEffect(() => {
    let dirty = false;
    try {
      dirty = localStorage.getItem(CONTENT_DIRTY_KEY) === '1';
      const cached = JSON.parse(localStorage.getItem(CONTENT_CACHE_KEY) || 'null');
      if (cached) { applyContent(cached); if (dirty) lastSynced.current = ''; }
    } catch (e) {}
    (async () => {
      try {
        const r = await apiPost({ action: 'content_get' });
        if (r && r.ok && r.content && !dirty) {
          applyContent(r.content);
          try { localStorage.setItem(CONTENT_CACHE_KEY, JSON.stringify(r.content)); } catch (e) {}
        }
      } catch (e) {}
      setContentReady(true);
    })();
  }, []);
  useEffect(() => {
    if (!contentReady || !isAdminAuthenticated || !window.__adminAuth) return;
    const snap = snapshot(orgSettings, activities, gallery, notices, members);
    if (snap === lastSynced.current) return;
    const content = { orgSettings, activities, gallery, notices, members };
    // Sathe sathe ei browser e save (reload dileo thakbe)
    try { localStorage.setItem(CONTENT_CACHE_KEY, JSON.stringify(content)); localStorage.setItem(CONTENT_DIRTY_KEY, '1'); } catch (e) {}
    const t = setTimeout(async () => {
      try {
        const r = await apiPost({ action: 'content_save', email: window.__adminAuth.email, password: window.__adminAuth.password, content });
        if (r && r.ok) {
          lastSynced.current = snap;
          try { localStorage.removeItem(CONTENT_DIRTY_KEY); } catch (e) {}
          showToast('✓ পরিবর্তন সেভ হয়েছে — সবাই লাইভ দেখতে পাবে');
        } else { showToast('এই ব্রাউজারে সেভ হয়েছে, কিন্তু সার্ভারে হয়নি — সবাই দেখবে না। Apps Script সেটআপ চেক করুন।', 'error'); }
      } catch (e) { showToast('এই ব্রাউজারে সেভ হয়েছে, কিন্তু সার্ভারে হয়নি — সবাই দেখবে না। Apps Script সেটআপ চেক করুন।', 'error'); }
    }, 1200);
    return () => clearTimeout(t);
  }, [orgSettings, activities, gallery, notices, members, contentReady, isAdminAuthenticated]);

  // Toast Notification State (No browser alerts!)
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('nag_user') || 'null'); } catch (e) { return null; } });
  const loginUser = (u) => { try { localStorage.setItem('nag_user', JSON.stringify(u)); } catch (e) {} setUser(u); };
  useEffect(() => {
    const h = () => { try { localStorage.removeItem('nag_user'); } catch (e) {} setUser(null); };
    window.addEventListener('nag-logout', h);
    return () => window.removeEventListener('nag-logout', h);
  }, []);
  useEffect(() => { document.body.style.overflow = user ? '' : 'hidden'; }, [user]);
  const [toast, setToast] = useState(null);

  const showToast = (message, type = 'success') => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 4000);
  };

  // Load Google Fonts (Hind Siliguri + Inter) dynamically
  useEffect(() => {
    const link = document.createElement('link');
    link.href = 'https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap';
    link.rel = 'stylesheet';
    document.head.appendChild(link);
  }, []);

  const handleAdminLogin = async (e) => {
    e.preventDefault();
    if (APPS_SCRIPT_URL) {
      try {
        setLoginError('যাচাই করা হচ্ছে...');
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', email: adminCredentials.email.trim(), password: adminCredentials.password })
        });
        const data = await res.json();
        if (data.ok) {
          window.__adminAuth = { email: adminCredentials.email.trim(), password: adminCredentials.password };
          setIsAdminAuthenticated(true);
          setShowAdminLoginModal(false);
          setViewMode('admin');
          setLoginError('');
          showToast('অ্যাডমিন প্যানেলে স্বাগতম!');
        } else {
          setLoginError(data.message || 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।');
        }
      } catch (err) {
        setLoginError('সার্ভারের সাথে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
      }
      return;
    }
    setLoginError('সার্ভার সংযোগ সেট করা হয়নি। APPS_SCRIPT_URL বসান।');
  };

  return (
    <div
      style={{ fontFamily: "'Poppins','Anek Bangla',system-ui,-apple-system,sans-serif" }}
      className="min-h-screen bg-white text-[#17191C] antialiased selection:bg-[#087F5B] selection:text-white"
    >
      {!user && <UserGate onAuth={loginUser} />}
      {/* Global Custom Toast Notification */}
      {toast && (
        <div className="fixed bottom-24 lg:bottom-6 left-4 right-4 lg:left-auto lg:right-6 z-[100] flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-[#101D35]/95 backdrop-blur-xl text-white shadow-2xl border border-white/15 transition-all duration-300 animate-fade-in">
          {toast.type === 'success' ? (
            <CheckCircle2 size={20} strokeWidth={2} className="text-[#087F5B] shrink-0" />
          ) : (
            <AlertCircle size={20} strokeWidth={2} className="text-white shrink-0" />
          )}
          <span className="text-sm font-medium">{toast.message}</span>
        </div>
      )}

      {/* Admin Login Modal */}
      {showAdminLoginModal && (
        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-[#101D35]/50 backdrop-blur-md">
          <div className="w-full max-w-md rounded-[26px] bg-white/90 backdrop-blur-2xl p-8 shadow-2xl border border-white/60">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-[#087F5B]/10 flex items-center justify-center text-[#087F5B]">
                  <img src={LOGO_SRC} alt="নাগমুদ আদর্শ যুব ক্রীড়া সংঘের লোগো" className="w-9 h-9 rounded-full object-cover" />
                </div>
                <div>
                  <h3 className="text-xl font-bold text-[#17191C]">অ্যাডমিন লগইন</h3>
                  <p className="text-xs text-[#858B93]">সংগঠন ব্যবস্থাপনা প্যানেল</p>
                </div>
              </div>
              <button
                onClick={() => setShowAdminLoginModal(false)}
                className="p-2 rounded-full hover:bg-[#F5F6F7] text-[#858B93] transition-colors"
              >
                <X size={20} />
              </button>
            </div>

            <form onSubmit={handleAdminLogin} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-[#17191C] mb-1.5">ইমেইল ঠিকানা</label>
                <input
                  type="email"
                  required
                  value={adminCredentials.email}
                  onChange={(e) => setAdminCredentials({ ...adminCredentials, email: e.target.value })}
                  className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-[#17191C] mb-1.5">পাসওয়ার্ড</label>
                <input
                  type="password"
                  required
                  placeholder="পাসওয়ার্ড লিখুন" autoComplete="current-password"
                  value={adminCredentials.password}
                  onChange={(e) => setAdminCredentials({ ...adminCredentials, password: e.target.value })}
                  className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                />
              </div>

              {loginError && (
                <p className="text-xs text-[#101D35] bg-[#F5F6F7] px-3 py-2 rounded-lg border-l-2 border-[#087F5B]">
                  {loginError}
                </p>
              )}

              <div className="pt-2 flex flex-col gap-2.5">
                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-[#087F5B] hover:bg-[#06694b] text-white font-semibold text-sm transition-all shadow-lg shadow-[#087F5B]/20"
                >
                  লগইন
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Switch between Public Website & Admin Dashboard */}
      {viewMode === 'public' ? (
        <PublicWebsite
          orgSettings={orgSettings}
          activities={activities}
          gallery={gallery}
          notices={notices.filter((n) => n.published)}
          members={members}
          onSubmitApplication={(appData) => {
            const newApp = {
              ...appData,
              id: `APP-${Date.now().toString().slice(-4)}`,
              status: 'pending',
              appliedAt: 'আজ'
            };
            setApplications([newApp, ...applications]);
            showToast('আপনার স্বেচ্ছাসেবক আবেদন সফলভাবে জমা হয়েছে!');
          }}
          onSubmitContact={(msgData) => {
            setContactMessages([{ ...msgData, id: Date.now(), date: 'আজ' }, ...contactMessages]);
            showToast('আপনার বার্তা সফলভাবে পাঠানো হয়েছে। ধন্যবাদ!');
          }}
          onOpenAdmin={() => {
            if (isAdminAuthenticated) {
              setViewMode('admin');
            } else {
              setShowAdminLoginModal(true);
            }
          }}
        />
      ) : (
        <AdminDashboard
          orgSettings={orgSettings}
          setOrgSettings={setOrgSettings}
          activities={activities}
          setActivities={setActivities}
          gallery={gallery}
          setGallery={setGallery}
          notices={notices}
          setNotices={setNotices}
          members={members}
          setMembers={setMembers}
          applications={applications}
          setApplications={setApplications}
          contactMessages={contactMessages}
          showToast={showToast}
          onBackToWebsite={() => setViewMode('public')}
          onLogout={() => {
            window.__adminAuth = null;
            setIsAdminAuthenticated(false);
            setViewMode('public');
            showToast('সফলভাবে লগআউট সম্পন্ন হয়েছে');
          }}
        />
      )}
    </div>
  );
}

// ============================================================================
// PUBLIC WEBSITE COMPONENT
// ============================================================================

function PublicWebsite({
  orgSettings,
  activities,
  gallery,
  notices,
  members,
  onSubmitApplication,
  onSubmitContact,
  onOpenAdmin
}) {
  const [scrolled, setScrolled] = useState(false);
  const [activeNav, setActiveNav] = useState('home');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // Gallery Filter & Lightbox State
  const [galleryFilter, setGalleryFilter] = useState('সব');
  const [lightboxIndex, setLightboxIndex] = useState(null);

  // Notice Modal State
  const [selectedNotice, setSelectedNotice] = useState(null);

  // Volunteer Form State
  const [volunteerForm, setVolunteerForm] = useState({
    fullName: '',
    phone: '',
    email: '',
    address: '',
    profession: '',
    interest: 'স্বেচ্ছায় রক্তদান',
    bio: ''
  });
  const [volunteerSubmitted, setVolunteerSubmitted] = useState(false);

  // Contact Form State
  const [contactForm, setContactForm] = useState({
    name: '',
    phone: '',
    subject: '',
    message: ''
  });

  useEffect(() => {
    const handleScroll = () => {
      setScrolled(window.scrollY > 30);

      const sections = ['home', 'about', 'activities', 'sports', 'gallery', 'volunteer', 'contact'];
      for (const sec of sections) {
        const el = document.getElementById(sec);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= 160 && rect.bottom >= 160) {
            setActiveNav(sec);
            break;
          }
        }
      }
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const navItems = [
    { id: 'home', label: 'হোম' },
    { id: 'about', label: 'আমাদের সম্পর্কে' },
    { id: 'activities', label: 'কার্যক্রম' },
    { id: 'sports', label: 'খেলাধুলা' },
    { id: 'gallery', label: 'গ্যালারি' },
    { id: 'volunteer', label: 'সদস্য হোন' },
    { id: 'contact', label: 'যোগাযোগ' }
  ];

  const scrollToSection = (id) => {
    setMobileMenuOpen(false);
    setActiveNav(id);
    const el = document.getElementById(id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth' });
    }
  };

  // Filtered Gallery
  const galleryCategories = ['সব', 'সামাজিক কার্যক্রম', 'রক্তদান', 'খেলাধুলা', 'অনুষ্ঠান', 'অন্যান্য'];
  const filteredGallery =
    galleryFilter === 'সব' ? gallery : gallery.filter((item) => item.category === galleryFilter);

  const handleVolunteerSubmit = (e) => {
    e.preventDefault();
    onSubmitApplication(volunteerForm);
    setVolunteerSubmitted(true);
    setVolunteerForm({
      fullName: '',
      phone: '',
      email: '',
      address: '',
      profession: '',
      interest: 'স্বেচ্ছায় রক্তদান',
      bio: ''
    });
    setTimeout(() => setVolunteerSubmitted(false), 6000);
  };

  const handleContactSubmit = (e) => {
    e.preventDefault();
    onSubmitContact(contactForm);
    setContactForm({ name: '', phone: '', subject: '', message: '' });
  };

  const activeMembersCount = members.filter((m) => m.status === 'সক্রিয়').length;

  return (
    <div className="relative overflow-x-hidden pb-24 lg:pb-0">
      {/* ====================================================================
          A. FLOATING GLASS NAVIGATION BAR
      ==================================================================== */}
      <header className="fixed top-0 left-0 right-0 z-50 px-4 sm:px-6 lg:px-8 pt-4 transition-all duration-300">
        <nav
          className={`max-w-7xl mx-auto rounded-[22px] transition-all duration-500 ${
            scrolled
              ? 'bg-white/75 backdrop-blur-2xl shadow-[0_8px_32px_rgba(16,29,53,0.08)] border border-white/80 py-3 px-5'
              : 'bg-white/65 backdrop-blur-xl shadow-[0_4px_24px_rgba(16,29,53,0.04)] border border-white/60 py-3.5 px-6'
          }`}
        >
          <div className="flex items-center justify-between">
            {/* Brand / Logo */}
            <button
              onClick={() => scrollToSection('home')}
              className="flex items-center gap-3 text-left group focus:outline-none"
            >
              <div className="w-11 h-11 rounded-full bg-black flex items-center justify-center overflow-hidden flex-none text-white shadow-md shadow-[#087F5B]/20 group-hover:scale-105 transition-transform">
                <img src={LOGO_SRC} alt="নাগমুদ আদর্শ যুব ক্রীড়া সংঘের লোগো" className="w-full h-full rounded-full object-cover" />
              </div>
              <div>
                <span className="block text-base sm:text-lg font-bold tracking-tight text-[#17191C] leading-tight">
                  {orgSettings.nameBn}
                </span>
                <span className="block text-[11px] font-medium text-[#858B93] tracking-wide">

                </span>
              </div>
            </button>

            {/* Desktop Navigation Links */}
            <div className="hidden lg:flex items-center gap-1 bg-[#F5F6F7]/80 p-1 rounded-full border border-black/[0.03]">
              {navItems.map((item) => {

                return (

                    className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 ${

                  </button>

              })}
            </div>

            {/* Right Action: Admin Access & Mobile Menu Button */}
            <div className="flex items-center gap-2.5">
              <LangToggle />
            <UserChip />
            <button
                onClick={onOpenAdmin}
                title="লগইন"
                className="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#101D35] hover:bg-[#192b4d] text-white text-xs font-medium transition-all shadow-sm"
              >
                <LayoutDashboard size={15} strokeWidth={1.85} />
                <span>লগইন</span>
              </button>

              <button
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}

                className="lg:hidden p-2.5 rounded-xl bg-[#F5F6F7] text-[#17191C] hover:bg-[#e9ecef] transition-colors"
              >
                {mobileMenuOpen ? <X size={20} /> : <Menu size={20} />}
              </button>
            </div>
          </div>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="lg:hidden mt-4 pt-4 border-t border-black/5 flex flex-col gap-1.5 animate-fade-in">
              {navItems.map((item) => (
                <button
                  key={item.id}
                  onClick={() => scrollToSection(item.id)}
                  className={`w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                    activeNav === item.id
                      ? 'bg-[#087F5B]/10 text-[#087F5B] font-semibold'
                      : 'text-[#17191C] hover:bg-[#F5F6F7]'
                  }`}
                >
                  {item.label}
                </button>
              ))}
              <button
                onClick={() => {
                  setMobileMenuOpen(false);
                  onOpenAdmin();

                className="mt-2 w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-[#101D35] text-white text-sm font-medium"
              >
                <LayoutDashboard size={16} />
                <span>লগইন</span>
              </button>
            </div>

        <div className="flex items-stretch justify-between max-w-md mx-auto">
          {[
            { id: 'home', label: 'হোম', Icon: Home },
            { id: 'activities', label: 'কার্যক্রম', Icon: HeartHandshake },
            { id: 'gallery', label: 'গ্যালারি', Icon: Images },
            { id: 'volunteer', label: 'সদস্য', Icon: UserPlus },

            <button
              key={id}
              onClick={() => scrollToSection(id)}
              aria-label={label}
              className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl ${activeNav === id ? 'text-[#087F5B]' : 'text-[#858B93]'}`}
            >
              <span className={`px-4 py-1 rounded-full ${activeNav === id ? 'bg-[#087F5B]/12' : ''}`}>
                <Icon size={22} strokeWidth={activeNav === id ? 2.2 : 1.8} />
              </span>
              <span className="text-[10.5px] font-medium leading-tight">{label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* ====================================================================
          B. HERO SECTION (APPLE-INSPIRED CINEMATIC GLASS EXPERIENCE)
      ==================================================================== */}
      <section id="home" className="relative pt-28 pb-16 sm:pt-36 sm:pb-24 px-4 sm:px-6 lg:px-8 overflow-hidden">
        {/* Subtle Ambient Background Lighting */}
        <div className="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-[900px] h-[500px] rounded-full bg-[#087F5B]/[0.06] blur-3xl" />
        <div className="pointer-events-none absolute top-40 -right-32 w-[500px] h-[500px] rounded-full bg-[#101D35]/[0.05] blur-3xl" />

        <div className="max-w-7xl mx-auto">
          {/* Top Editorial Badge */}

            <div className="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-[#F5F6F7] border border-black/[0.05] text-xs sm:text-sm font-medium text-[#101D35]">
              <span className="w-2 h-2 rounded-full bg-[#087F5B]" />
              <span>অরাজনৈতিক ও অলাভজনক সমাজকল্যাণমূলক যুব সংগঠন • স্থাপিত ২০১৪</span>

              >
                <span>আমাদের সম্পর্কে</span>
                <ArrowRight size={18} strokeWidth={2} />

              <button

                className="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-8 py-4 rounded-full bg-[#F5F6F7] hover:bg-[#ebedef] text-[#17191C] font-semibold text-base transition-all border border-black/[0.05]"
              >
                <Mail size={18} strokeWidth={1.85} className="text-[#101D35]" />

          <div className="relative rounded-[28px] overflow-hidden shadow-[0_24px_60px_rgba(16,29,53,0.12)] border border-black/[0.05] aspect-[16/10] sm:aspect-[16/8] max-h-[620px] bg-[#101D35]">
            <img
              src={orgSettings.heroImage || "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&q=85&w=1800"}
              alt="নাগমুদ আদর্শ যুব ক্রীড়া সংঘের তরুণ স্বেচ্ছাসেবক ও ঐক্য"
              className="w-full h-full object-cover object-center scale-[1.01] transition-transform duration-1000 hover:scale-105"
            />
            {/* Refined Dark Vignette Overlay */}
            <div className="absolute inset-0 bg-gradient-to-t from-[#101D35]/80 via-[#101D35]/20 to-transparent" />

            {/* Floating Frosted Glass Info Card */}
            <div className="absolute bottom-4 left-4 right-4 sm:bottom-8 sm:left-8 sm:right-auto sm:max-w-md rounded-[22px] bg-white/75 backdrop-blur-2xl p-5 sm:p-6 border border-white/80 shadow-xl">
              <div className="flex items-start gap-4">
                <div className="w-11 h-11 rounded-2xl bg-[#087F5B] text-white flex items-center justify-center shrink-0">
                  <HeartHandshake size={22} strokeWidth={1.85} />
                </div>
                <div>
                  <p className="text-xs font-semibold uppercase tracking-wider text-[#087F5B] mb-1">
                    নাগমুদ, রামগঞ্জ, লক্ষ্মীপুর
                  </p>
                  <h3 className="text-base sm:text-lg font-bold text-[#17191C] leading-snug mb-1.5">

      {/* ====================================================================

      <section id="about" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-[#F5F6F7]">

                  {orgSettings.aboutHistory}
                </p>
              </div>
              <div className="pt-6 border-t border-black/[0.05] flex flex-wrap items-center gap-6 text-sm text-[#858B93]">

                  <CheckCircle2 size={18} className="text-[#087F5B]" /> ১০০% অরাজনৈতিক
                </span>
                <span className="inline-flex items-center gap-2 font-medium text-[#101D35]">
                  <CheckCircle2 size={18} className="text-[#087F5B]" /> অলাভজনক ও সেবামূলক
                </span>
                <span className="inline-flex items-center gap-2 font-medium text-[#101D35]">
                  <CheckCircle2 size={18} className="text-[#087F5B]" /> যুব নেতৃত্ব পরিচালিত
                </span>
              </div>
            </RevealSection>

            {/* Card 2: আমাদের লক্ষ্য */}
            <RevealSection delay={100} className="lg:col-span-5 rounded-[28px] bg-[#101D35] text-white p-8 sm:p-10 shadow-xl flex flex-col justify-between">
              <div>
                <div className="w-12 h-12 rounded-2xl bg-white/10 text-white flex items-center justify-center mb-6">
                  <Target size={24} strokeWidth={1.85} />
                </div>
                <h3 className="text-2xl font-bold mb-4">আমাদের লক্ষ্য</h3>
                <p className="text-base text-white/80 leading-relaxed">
                  {orgSettings.mission}
                </p>
              </div>
              <div className="mt-8 pt-6 border-t border-white/10">
                <p className="text-xs uppercase tracking-wider text-white/50">মূলমন্ত্র</p>
                <p className="text-base font-semibold text-white mt-1">
                  “মানবতার সেবাই পরম ধর্ম, ক্রীড়াই হোক সুস্থ জীবনের অঙ্গীকার”
                </p>
              </div>
            </RevealSection>

            {/* Card 3: আমাদের উদ্দেশ্য */}
            <RevealSection delay={150} className="lg:col-span-6 rounded-[28px] bg-white/80 backdrop-blur-2xl p-8 sm:p-10 border border-white shadow-[0_8px_30px_rgba(16,29,53,0.04)]">
              <div className="w-12 h-12 rounded-2xl bg-[#101D35]/10 text-[#101D35] flex items-center justify-center mb-6">
                <Compass size={24} strokeWidth={1.85} />
              </div>
              <h3 className="text-2xl font-bold text-[#17191C] mb-4">আমাদের উদ্দেশ্য</h3>
              <p className="text-base text-[#17191C]/80 leading-relaxed">
                {orgSettings.vision}
              </p>
            </RevealSection>

            {/* Card 4: আমাদের ভবিষ্যৎ পরিকল্পনা */}
            <RevealSection delay={200} className="lg:col-span-6 rounded-[28px] bg-white/80 backdrop-blur-2xl p-8 sm:p-10 border border-white shadow-[0_8px_30px_rgba(16,29,53,0.04)]">
              <div className="w-12 h-12 rounded-2xl bg-[#087F5B]/10 text-[#087F5B] flex items-center justify-center mb-6">
                <Rocket size={24} strokeWidth={1.85} />
              </div>
              <h3 className="text-2xl font-bold text-[#17191C] mb-4">আমাদের ভবিষ্যৎ পরিকল্পনা</h3>
              <p className="text-base text-[#17191C]/80 leading-relaxed">
                {orgSettings.futurePlan}
              </p>
            </RevealSection>
          </div>
        </div>
      </section>

      {/* ====================================================================
          E. SOCIAL & HUMANITARIAN ACTIVITIES
      ==================================================================== */}
      <section id="activities" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-white">
        <div className="max-w-7xl mx-auto">
          <RevealSection className="flex flex-col md:flex-row md:items-end justify-between mb-14 gap-6">
            <div className="max-w-2xl">
              <span className="inline-block text-xs font-bold uppercase tracking-widest text-[#087F5B] mb-3">
                সামাজিক ও মানবিক কার্যক্রম
              </span>
              <h2 className="text-3xl sm:text-4xl lg:text-5xl font-bold text-[#17191C] tracking-tight leading-tight">
                আর্তমানবতার কল্যাণে আমাদের নিয়মিত উদ্যোগসমূহ
              </h2>
            </div>
            <p className="text-base text-[#858B93] max-w-md">
              প্রতিটি কার্যক্রম স্বচ্ছতা, আন্তরিকতা এবং স্থানীয় জনগণের সক্রিয় অংশগ্রহণে পরিচালিত হয়।
            </p>

              <RevealSection

                delay={idx * 80}
                className="group rounded-[26px] bg-white border border-black/[0.06] overflow-hidden shadow-[0_4px_24px_rgba(16,29,53,0.03)] hover:shadow-[0_20px_40px_rgba(16,29,53,0.08)] hover:-translate-y-1 transition-all duration-500 flex flex-col"
              >
                {/* Activity Image */}
                <div className="relative h-56 overflow-hidden bg-[#F5F6F7]">
                  <img
                    src={activity.image}
                    alt={activity.title}
                    loading="lazy"
                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                  />
                  <div className="absolute top-4 left-4">
                    <span className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white/85 backdrop-blur-md text-xs font-semibold text-[#17191C] shadow-sm">
                      {activity.category}
                    </span>
                  </div>
                </div>

                {/* Activity Body */}
                <div className="p-7 flex-1 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-4">
                      <div className="w-11 h-11 rounded-2xl bg-[#087F5B]/10 text-[#087F5B] flex items-center justify-center">
                        <DynamicIcon name={activity.iconName} size={22} />
                      </div>
                      <span className="text-xs font-medium text-[#858B93]">{activity.date}</span>
                    </div>
                    <h3 className="text-xl font-bold text-[#17191C] mb-3 group-hover:text-[#087F5B] transition-colors">
                      {activity.title}
                    </h3>
                    <p className="text-sm sm:text-base text-[#858B93] leading-relaxed">
                      {activity.description}
                    </p>
                  </div>

                  <div className="mt-6 pt-4 border-t border-black/[0.04] flex items-center justify-between">
                    <button
                      onClick={() => scrollToSection('volunteer')}
                      className="inline-flex items-center gap-1.5 text-sm font-semibold text-[#087F5B] hover:gap-2.5 transition-all"
                    >
                      <span>স্বেচ্ছাসেবক হিসেবে যুক্ত হোন</span>
                      <ChevronRight size={16} />
                    </button>
                  </div>
                </div>
              </RevealSection>
            ))}
          </div>
        </div>
      </section>

      {/* ====================================================================
          F. YOUTH SPORTS ACTIVITIES (EDITORIAL DARK SECTION)
      ==================================================================== */}
      <section id="sports" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-[#101D35] text-white relative overflow-hidden">
        {/* Subtle Ambient Glow */}
        <div className="pointer-events-none absolute top-0 right-0 w-[600px] h-[600px] rounded-full bg-[#087F5B]/10 blur-3xl" />

        <div className="max-w-7xl mx-auto relative z-10">
          <RevealSection className="max-w-3xl mb-16">
            <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 text-xs font-semibold tracking-wider uppercase text-white/90 mb-4">
              <Trophy size={15} strokeWidth={1.85} />
              <span>যুব ক্রীড়া ও সৃজনশীল কার্যক্রম</span>
            </div>
            <h2 className="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight leading-tight mb-5">
              মাদকমুক্ত সুস্থ প্রজন্ম গড়তে খেলাধুলার বিকল্প নেই
            </h2>
            <p className="text-base sm:text-lg text-white/70 leading-relaxed">
              ফুটবল, ক্রিকেট, ব্যাডমিন্টন থেকে শুরু করে ইনডোর ও স্থানীয় ঐতিহ্যবাহী ক্রীড়া প্রতিযোগিতার মাধ্যমে আমরা তরুণদের শারীরিক ও মানসিক উৎকর্ষ সাধনে কাজ করছি।
            </p>
          </RevealSection>

          {/* Editorial Alternating Showcase */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {SPORTS_DATA.map((sport, idx) => (
              <RevealSection
                key={sport.id}
                delay={idx * 100}
                className="group rounded-[28px] bg-white/[0.06] backdrop-blur-xl border border-white/10 overflow-hidden hover:bg-white/[0.09] transition-all duration-500 flex flex-col sm:flex-row"
              >
                <div className="sm:w-2/5 h-56 sm:h-auto relative overflow-hidden">
                  <img
                    src={sport.image}
                    alt={sport.title}
                    loading="lazy"
                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                  />
                </div>
                <div className="sm:w-3/5 p-7 sm:p-8 flex flex-col justify-between">
                  <div>
                    <span className="inline-block text-xs font-semibold text-[#087F5B] bg-white px-3 py-1 rounded-full mb-4">
                      {sport.tag}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold text-white mb-1.5">
                      {sport.title}
                    </h3>
                    <p className="text-xs font-medium text-white/60 mb-3">{sport.subtitle}</p>
                    <p className="text-sm text-white/75 leading-relaxed">
                      {sport.description}
                    </p>
                  </div>
                  <div className="mt-6 pt-4 border-t border-white/10 flex items-center gap-2 text-xs text-white/60">
                    <Trophy size={15} className="text-white" />
                    <span>নাগমুদ আদর্শ যুব ক্রীড়া সংঘ ক্রীড়া বিভাগ</span>
                  </div>
                </div>
              </RevealSection>

          </div>
