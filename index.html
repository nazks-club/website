      {/* ====================================================================
          G. PHOTO GALLERY (MASONRY + FILTER + FULLSCREEN LIGHTBOX)
      ==================================================================== */}
      <section id="gallery" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-[#F5F6F7]">
        <div className="max-w-7xl mx-auto">
          <RevealSection className="text-center max-w-2xl mx-auto mb-12">
            <span className="inline-block text-xs font-bold uppercase tracking-widest text-[#087F5B] mb-3">
              স্মৃতির ফ্রেমে আমাদের পথচলা
            </span>
            <h2 className="text-3xl sm:text-4xl lg:text-5xl font-bold text-[#17191C] tracking-tight mb-4">
              ফটো গ্যালারি
            </h2>
            <p className="text-base text-[#858B93]">
              আমাদের বিভিন্ন সামাজিক কার্যক্রম, রক্তদান শিবির, ক্রীড়া প্রতিযোগিতা ও অনুষ্ঠানের বিশেষ মুহূর্তসমূহ।
            </p>
          </RevealSection>

          {/* Category Filter Pills */}
          <div className="flex flex-wrap items-center justify-center gap-2 mb-12">
            {galleryCategories.map((cat) => (
              <button
                key={cat}
                onClick={() => setGalleryFilter(cat)}
                className={`px-5 py-2.5 rounded-full text-sm font-medium transition-all ${
                  galleryFilter === cat
                    ? 'bg-[#087F5B] text-white shadow-md shadow-[#087F5B]/20'
                    : 'bg-white text-[#17191C]/80 hover:bg-white/90 border border-black/[0.04]'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Responsive Masonry Grid */}
          <div className="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
            {filteredGallery.map((item, idx) => (
              <div
                key={item.id}
                onClick={() => setLightboxIndex(idx)}
                className="break-inside-avoid group relative rounded-[24px] overflow-hidden bg-white shadow-sm hover:shadow-xl transition-all duration-500 cursor-pointer border border-black/[0.04]"
              >
                <img
                  src={item.url}
                  alt={item.title}
                  loading="lazy"
                  className="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-700"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-[#101D35]/85 via-[#101D35]/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">
                  <span className="inline-block w-fit px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-white text-xs font-medium mb-2">
                    {item.category}
                  </span>
                  <h4 className="text-lg font-bold text-white leading-snug">{item.title}</h4>
                  <p className="text-xs text-white/75 mt-1">{item.date}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Fullscreen Lightbox Modal */}
        {lightboxIndex !== null && filteredGallery[lightboxIndex] && (
          <div className="fixed inset-0 z-[95] bg-[#101D35]/95 backdrop-blur-2xl flex items-center justify-center p-4 sm:p-8">
            <button
              onClick={() => setLightboxIndex(null)}
              aria-label="বন্ধ করুন"
              className="absolute top-6 right-6 p-3 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors"
            >
              <X size={24} />
            </button>

            <button
              onClick={() =>
                setLightboxIndex((lightboxIndex - 1 + filteredGallery.length) % filteredGallery.length)
              }
              aria-label="পূর্ববর্তী ছবি"
              className="absolute left-4 sm:left-8 p-3.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors"
            >
              <ChevronLeft size={26} />
            </button>

            <div className="max-w-4xl w-full flex flex-col items-center">
              <img
                src={filteredGallery[lightboxIndex].url}
                alt={filteredGallery[lightboxIndex].title}
                className="max-h-[75vh] w-auto rounded-[22px] shadow-2xl object-contain"
              />
              <div className="mt-5 text-center text-white">
                <span className="text-xs uppercase tracking-wider text-white/60">
                  {filteredGallery[lightboxIndex].category} • {filteredGallery[lightboxIndex].date}
                </span>
                <h3 className="text-xl font-bold mt-1">{filteredGallery[lightboxIndex].title}</h3>
              </div>
            </div>

            <button
              onClick={() => setLightboxIndex((lightboxIndex + 1) % filteredGallery.length)}
              aria-label="পরবর্তী ছবি"
              className="absolute right-4 sm:right-8 p-3.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors"
            >
              <ChevronRight size={26} />
            </button>
          </div>
        )}
      </section>

      {/* ====================================================================
          I. LATEST NEWS & NOTICES
      ==================================================================== */}
      <section className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-white">
        <div className="max-w-7xl mx-auto">
          <RevealSection className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-4">
            <div>
              <span className="inline-block text-xs font-bold uppercase tracking-widest text-[#087F5B] mb-3">
                নোটিশ বোর্ড ও আপডেট
              </span>
              <h2 className="text-3xl sm:text-4xl font-bold text-[#17191C] tracking-tight">
                সর্বশেষ ঘোষণা ও সাংগঠনিক সংবাদ
              </h2>
            </div>
            <p className="text-sm text-[#858B93]">সকল অফিসিয়াল বিজ্ঞপ্তি ও আসন্ন ইভেন্টের তথ্য</p>
          </RevealSection>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {notices.map((notice, idx) => (
              <RevealSection
                key={notice.id}
                delay={idx * 90}
                className="rounded-[24px] bg-[#F5F6F7]/80 hover:bg-white p-7 border border-black/[0.05] hover:shadow-xl hover:shadow-[#101D35]/[0.05] transition-all duration-300 flex flex-col justify-between"
              >
                <div>
                  <div className="flex items-center justify-between gap-2 mb-4">
                    <span className="px-3 py-1 rounded-full bg-[#087F5B]/10 text-[#087F5B] text-xs font-semibold">
                      {notice.category}
                    </span>
                    <span className="inline-flex items-center gap-1.5 text-xs text-[#858B93]">
                      <CalendarDays size={14} />
                      {notice.date}
                    </span>
                  </div>
                  <h3 className="text-lg sm:text-xl font-bold text-[#17191C] leading-snug mb-3">
                    {notice.title}
                  </h3>
                  <p className="text-sm text-[#858B93] leading-relaxed line-clamp-3">
                    {notice.summary}
                  </p>
                </div>

                <div className="mt-6 pt-4 border-t border-black/[0.05]">
                  <button
                    onClick={() => setSelectedNotice(notice)}
                    className="inline-flex items-center gap-1.5 text-sm font-semibold text-[#101D35] hover:text-[#087F5B] transition-colors"
                  >
                    <span>বিস্তারিত পড়ুন</span>
                    <ArrowRight size={16} />
                  </button>
                </div>
              </RevealSection>
            ))}
          </div>
        </div>

        {/* Notice Details Modal */}
        {selectedNotice && (
          <div className="fixed inset-0 z-[90] bg-[#101D35]/50 backdrop-blur-md flex items-center justify-center p-4">
            <div className="w-full max-w-2xl rounded-[28px] bg-white p-7 sm:p-9 shadow-2xl border border-white">
              <div className="flex items-center justify-between mb-5">
                <span className="px-3.5 py-1 rounded-full bg-[#087F5B]/10 text-[#087F5B] text-xs font-semibold">
                  {selectedNotice.category}
                </span>
                <button
                  onClick={() => setSelectedNotice(null)}
                  className="p-2 rounded-full hover:bg-[#F5F6F7] text-[#858B93]"
                >
                  <X size={20} />
                </button>
              </div>
              <p className="text-xs text-[#858B93] mb-2">প্রকাশের তারিখ: {selectedNotice.date}</p>
              <h3 className="text-2xl font-bold text-[#17191C] leading-snug mb-5">
                {selectedNotice.title}
              </h3>
              <div className="p-5 rounded-2xl bg-[#F5F6F7] text-base text-[#17191C]/85 leading-relaxed mb-6">
                {selectedNotice.content}
              </div>
              <div className="flex justify-end">
                <button
                  onClick={() => setSelectedNotice(null)}
                  className="px-6 py-2.5 rounded-full bg-[#101D35] text-white text-sm font-medium hover:bg-[#192b4d] transition-colors"
                >
                  বন্ধ করুন
                </button>
              </div>
            </div>
          </div>
        )}
      </section>

      {/* ====================================================================
          H. BECOME A VOLUNTEER / MEMBERSHIP REGISTRATION
      ==================================================================== */}
      <section id="volunteer" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-[#F5F6F7] relative overflow-hidden">
        <div className="max-w-7xl mx-auto">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
            {/* Left Editorial Column */}
            <RevealSection className="lg:col-span-5">
              <span className="inline-block text-xs font-bold uppercase tracking-widest text-[#087F5B] mb-3">
                সদস্য হোন
              </span>
              <h2 className="text-3xl sm:text-4xl font-bold text-[#17191C] tracking-tight leading-tight mb-5">
                পরিবর্তনের অংশ হোন, স্বেচ্ছাসেবক হিসেবে যুক্ত হোন
              </h2>
              <p className="text-base text-[#858B93] leading-relaxed mb-8">
                আপনিও কি সমাজের মানুষের কল্যাণে এবং সুস্থ ক্রীড়া সংস্কৃতি বিকাশে কাজ করতে আগ্রহী? আজই নাগমুদ আদর্শ যুব ক্রীড়া সংঘের সদস্যপদের জন্য আবেদন করুন।
              </p>

              <div className="space-y-4">
                {[
                  { icon: Droplet, title: 'জীবন বাঁচানোর সুযোগ', desc: 'জরুরি রক্তদাতা নেটওয়ার্কে যুক্ত হয়ে মানবসেবা' },
                  { icon: Users, title: 'নেতৃত্ব ও দক্ষতা বিকাশ', desc: 'সামাজিক ও সাংগঠনিক কর্মকাণ্ডে নেতৃত্বের অভিজ্ঞতা' },
                  { icon: Trophy, title: 'ক্রীড়া ও সুস্থ বিনোদন', desc: 'নিয়মিত ক্রীড়া প্রতিযোগিতা ও প্রশিক্ষণে অংশগ্রহণ' }
                ].map((benefit, i) => (
                  <div
                    key={i}
                    className="flex items-start gap-4 p-4 rounded-2xl bg-white/80 backdrop-blur-md border border-white"
                  >
                    <div className="w-10 h-10 rounded-xl bg-[#087F5B]/10 text-[#087F5B] flex items-center justify-center shrink-0">
                      <benefit.icon size={20} strokeWidth={1.85} />
                    </div>
                    <div>
                      <h4 className="text-base font-bold text-[#17191C]">{benefit.title}</h4>
                      <p className="text-xs sm:text-sm text-[#858B93] mt-0.5">{benefit.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </RevealSection>

            {/* Right Glass Registration Form */}
            <RevealSection delay={120} className="lg:col-span-7">
              <div className="rounded-[28px] bg-white/85 backdrop-blur-2xl p-7 sm:p-10 shadow-[0_12px_40px_rgba(16,29,53,0.06)] border border-white">
                {volunteerSubmitted ? (
                  <div className="py-12 text-center">
                    <div className="w-16 h-16 rounded-full bg-[#087F5B]/10 text-[#087F5B] flex items-center justify-center mx-auto mb-5">
                      <CheckCircle2 size={34} strokeWidth={1.85} />
                    </div>
                    <h3 className="text-2xl font-bold text-[#17191C] mb-2">
                      আবেদন সফলভাবে গৃহীত হয়েছে!
                    </h3>
                    <p className="text-base text-[#858B93] max-w-md mx-auto mb-6">
                      ধন্যবাদ! আমাদের কার্যনির্বাহী কমিটি আপনার তথ্য যাচাই করে শীঘ্রই আপনার সাথে যোগাযোগ করবে।
                    </p>
                    <button
                      onClick={() => setVolunteerSubmitted(false)}
                      className="px-6 py-2.5 rounded-full bg-[#F5F6F7] text-[#17191C] text-sm font-semibold hover:bg-[#e9ecef] transition-colors"
                    >
                      আরেকটি আবেদন করুন
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleVolunteerSubmit} className="space-y-5">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          পূর্ণ নাম *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="আপনার পূর্ণ নাম লিখুন"
                          value={volunteerForm.fullName}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, fullName: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          মোবাইল নম্বর *
                        </label>
                        <input
                          type="tel"
                          required
                          placeholder="০১৭XX-XXXXXX"
                          value={volunteerForm.phone}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, phone: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          ইমেইল ঠিকানা
                        </label>
                        <input
                          type="email"
                          placeholder="example@email.com"
                          value={volunteerForm.email}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, email: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          পেশা *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="শিক্ষার্থী / চাকরিজীবী / ব্যবসায়ী"
                          value={volunteerForm.profession}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, profession: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          ঠিকানা *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="গ্রাম, ডাকঘর, উপজেলা"
                          value={volunteerForm.address}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, address: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                          আগ্রহের কার্যক্রম *
                        </label>
                        <select
                          value={volunteerForm.interest}
                          onChange={(e) => setVolunteerForm({ ...volunteerForm, interest: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all"
                        >
                          <option value="স্বেচ্ছায় রক্তদান">স্বেচ্ছায় রক্তদান</option>
                          <option value="বিনামূল্যে স্বাস্থ্যসেবা">বিনামূল্যে স্বাস্থ্যসেবা</option>
                          <option value="অসহায় মানুষের সহায়তা">অসহায় মানুষের সহায়তা</option>
                          <option value="ক্রীড়া ও যুব উন্নয়ন">ক্রীড়া ও যুব উন্নয়ন</option>
                          <option value="সামাজিক সচেতনতা ও বৃক্ষরোপণ">সামাজিক সচেতনতা ও বৃক্ষরোপণ</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-[#17191C] mb-1.5">
                        নিজের সম্পর্কে সংক্ষিপ্ত বিবরণ
                      </label>
                      <textarea
                        rows={3}
                        placeholder="কেন আপনি আমাদের সংগঠনে যুক্ত হতে চান তা সংক্ষেপে লিখুন..."
                        value={volunteerForm.bio}
                        onChange={(e) => setVolunteerForm({ ...volunteerForm, bio: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl bg-[#F5F6F7] border border-transparent focus:border-[#087F5B] focus:bg-white outline-none text-sm transition-all resize-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 rounded-xl bg-[#087F5B] hover:bg-[#06694b] text-white font-semibold text-base transition-all shadow-lg shadow-[#087F5B]/20 flex items-center justify-center gap-2"
                    >
                      <UserPlus size={19} strokeWidth={2} />
                      <span>সদস্যপদের আবেদন জমা দিন</span>
                    </button>
                  </form>
                )}
              </div>
            </RevealSection>
          </div>
        </div>
      </section>

      {/* ====================================================================
          J. CONTACT SECTION & GOOGLE MAPS
      ==================================================================== */}
      <section id="contact" className="py-20 sm:py-28 px-4 sm:px-6 lg:px-8 bg-white">
        <div className="max-w-7xl mx-auto">
          <RevealSection className="max-w-2xl mb-14">
            <span className="inline-block text-xs font-bold uppercase tracking-widest text-[#087F5B] mb-3">
              যোগাযোগ করুন
            </span>
            <h2 className="text-3xl sm:text-4xl lg:text-5xl font-bold text-[#17191C] tracking-tight mb-4">
              যেকোনো প্রয়োজনে আমরা আছি আপনার পাশে
            </h2>
            <p className="text-base text-[#858B93]">
              জরুরি রক্তের প্রয়োজন, সামাজিক সহযোগিতা কিংবা সাংগঠনিক পরামর্শের জন্য সরাসরি যোগাযোগ করুন।
            </p>
          </RevealSection>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Contact Info & Map */}
            <div className="lg:col-span-6 space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="p-6 rounded-[24px] bg-[#F5F6F7] border border-black/[0.03]">
                  <div className="w-10 h-10 rounded-xl bg-white text-[#087F5B] flex items-center justify-center mb-4 shadow-sm">
                    <Phone size={20} strokeWidth={1.85} />
                  </div>
                  <p className="text-xs font-medium text-[#858B93] mb-1">ফোন নম্বর</p>
                  <p className="text-base font-bold text-[#17191C]">{orgSettings.phone}</p>
                </div>

                <div className="p-6 rounded-[24px] bg-[#F5F6F7] border border-black/[0.03]">
                  <div className="w-10 h-10 rounded-xl bg-white text-[#101D35] flex items-center justify-center mb-4 shadow-sm">
                    <Mail size={20} strokeWidth={1.85} />
                  </div>
                  <p className="text-xs font-medium text-[#858B93] mb-1">ইমেইল</p>
                  <p className="text-base font-bold text-[#17191C] break-all">{orgSettings.email}</p>
                </div>
              </div>

              <div className="p-6 rounded-[24px] bg-[#F5F6F7] border border-black/[0.03] flex items-start gap-4">
                <div className="w-10 h-10 rounded-xl bg-white text-[#087F5B] flex items-center justify-center shrink-0 shadow-sm">
                  <MapPin size={20} strokeWidth={1.85} />
                </div>
                <div>
                  <p className="text-xs font-medium text-[#858B93] mb-1">কার্যালয়ের ঠিকানা</p>
                  <p className="text-base font-bold text-[#17191C]">{orgSettings.address}</p>
                </div>
              </div>

              {/* Embedded Map */}
              <div className="rounded-[24px] overflow-hidden border border-black/[0.06] h-64 bg-[#F5F6F7]">
                <iframe
                  title="নাগমুদ, রামগঞ্জ, লক্ষ্মীপুর মানচিত্র"
                  src={orgSettings.mapEmbedUrl}
                  className="w-full h-full border-0"
                  loading="lazy"
                  referrerPolicy="no-referrer-when-downgrade"
                />
              </div>
            </div>

            {/* Contact Form */}
            <div className="lg:col-span-6">
              <div className="rounded-[28px] bg-[#F5F6F7]/70 backdrop-blur-xl p-7 sm:p-10 border border-black/[0.04] h-full flex flex-col justify-center">
                <h3 className="text-2xl font-bold text-[#17191C] mb-2">সরাসরি বার্তা পাঠান</h3>
                <p className="text-sm text-[#858B93] mb-6">
                  আপনার মতামত বা প্রশ্ন নিচের ফর্মের মাধ্যমে আমাদের জানান।
                </p>

                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-[#17191C] mb-1.5">আপনার নাম *</label>
                    <input
                      type="text"
                      required
                      placeholder="নাম লিখুন"
                      value={contactForm.name}
                      onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                      className="w-full px-4 py-3.5 rounded-xl bg-white border border-black/[0.05] focus:border-[#087F5B] outline-none text-sm transition-all"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-semibold text-[#17191C] mb-1.5">মোবাইল নম্বর *</label>
                      <input
                        type="tel"
                        required
                        placeholder="০১XXXXXXXXX"
                        value={contactForm.phone}
                        onChange={(e) => setContactForm({ ...contactForm, phone: e.target.value })}
                        className="w-full px-4 py-3.5 rounded-xl bg-white border border-black/[0.05] focus:border-[#087F5B] outline-none text-sm transition-all"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-[#17191C] mb-1.5">বিষয় *</label>
                      <input
                        type="text"
                        required
                        placeholder="রক্তের প্রয়োজন / সাধারণ জিজ্ঞাসা"
                        value={contactForm.subject}
                        onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                        className="w-full px-4 py-3.5 rounded-xl bg-white border border-black/[0.05] focus:border-[#087F5B] outline-none text-sm transition-all"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-[#17191C] mb-1.5">বার্তা *</label>
                    <textarea
                      rows={4}
                      required
                      placeholder="আপনার বিস্তারিত বার্তা লিখুন..."
                      value={contactForm.message}
                      onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                      className="w-full px-4 py-3.5 rounded-xl bg-white border border-black/[0.05] focus:border-[#087F5B] outline-none text-sm transition-all resize-none"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-4 rounded-xl bg-[#101D35] hover:bg-[#1a2d50] text-white font-semibold text-base transition-all shadow-lg shadow-[#101D35]/15"
                  >
                    বার্তা পাঠান
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* ====================================================================
          K. PREMIUM FOOTER
      ==================================================================== */}
      <footer className="bg-[#101D35] text-white pt-16 pb-10 px-4 sm:px-6 lg:px-8 border-t border-white/10">
        <div className="max-w-7xl mx-auto">
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-10 pb-12 border-b border-white/10">
            <div className="lg:col-span-5">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-11 h-11 rounded-full bg-black flex items-center justify-center overflow-hidden flex-none text-white">
                  <img src={LOGO_SRC} alt="নাগমুদ আদর্শ যুব ক্রীড়া সংঘের লোগো" className="w-full h-full rounded-full object-cover" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-white">{orgSettings.nameBn}</h3>
                  <p className="text-xs text-white/60">{orgSettings.nameEn}</p>
                </div>
              </div>
              <p className="text-sm text-white/70 leading-relaxed max-w-md mb-6">
                {orgSettings.tagline} ১৫ সেপ্টেম্বর ২০১৪ সাল থেকে নাগমুদ, রামগঞ্জ, লক্ষ্মীপুরে মানবিক ও ক্রীড়া উন্নয়নে নিবেদিত।
              </p>
              <div className="flex items-center gap-3">
                <a
                  href={orgSettings.facebook}
                  target="_blank"
                  rel="noreferrer"
                  aria-label="ফেসবুক পেজ"
                  className="w-10 h-10 rounded-full bg-white/10 hover:bg-[#087F5B] flex items-center justify-center text-white transition-colors"
                >
                  <Facebook size={18} />
                </a>
                <a
                  href={`mailto:${orgSettings.email}`}
                  aria-label="ইমেইল"
                  className="w-10 h-10 rounded-full bg-white/10 hover:bg-[#087F5B] flex items-center justify-center text-white transition-colors"
                >
                  <Mail size={18} />
                </a>
                <a
                  href={`tel:${orgSettings.phone}`}
                  aria-label="ফোন"
                  className="w-10 h-10 rounded-full bg-white/10 hover:bg-[#087F5B] flex items-center justify-center text-white transition-colors"
                >
                  <Phone size={18} />
                </a>
              </div>
            </div>

            <div className="lg:col-span-3">
              <h4 className="text-sm font-bold uppercase tracking-wider text-white mb-4">দ্রুত নেভিগেশন</h4>
              <ul className="space-y-2.5 text-sm text-white/70">
                {navItems.map((item) => (
                  <li key={item.id}>
                    <button
                      onClick={() => scrollToSection(item.id)}
                      className="hover:text-white transition-colors"
                    >
                      {item.label}
                    </button>
                  </li>
                ))}
              </ul>
            </div>

            <div className="lg:col-span-4">
              <h4 className="text-sm font-bold uppercase tracking-wider text-white mb-4">যোগাযোগ ও অবস্থান</h4>
              <ul className="space-y-3 text-sm text-white/70">
                <li className="flex items-start gap-3">
                  <MapPin size={18} className="text-[#087F5B] shrink-0 mt-0.5" />
                  <span>{orgSettings.address}</span>
                </li>
                <li className="flex items-center gap-3">
                  <Phone size={18} className="text-[#087F5B] shrink-0" />
                  <span>{orgSettings.phone}</span>
                </li>
                <li className="flex items-center gap-3">
                  <Mail size={18} className="text-[#087F5B] shrink-0" />
                  <span>{orgSettings.email}</span>
                </li>
              </ul>
            </div>
          </div>

          <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-white/50">
            <p>© ২০২৬ {orgSettings.nameBn}। সর্বস্বত্ব সংরক্ষিত। স্থাপিত: ২০১৪।</p>
            <button
              onClick={onOpenAdmin}
              className="inline-flex items-center gap-1.5 text-white/60 hover:text-white transition-colors"
            >
              <LayoutDashboard size={14} />
              <span>অ্যাডমিন প্যানেল</span>
            </button>
          </div>
        </div>
      </footer>
    </div>
  );
}

// ============================================================================
// ADMIN DASHBOARD COMPONENT (FULL CRUD + LIGHT/DARK MODE)
// ============================================================================

function AdminDashboard({
  orgSettings,
  setOrgSettings,
  activities,
  setActivities,
  gallery,
  setGallery,
  notices,
  setNotices,
  members,
  setMembers,
  applications,
  setApplications,
  contactMessages,
  showToast,
  onBackToWebsite,
  onLogout
}) {
  const [activeTab, setActiveTab] = useState('overview');
  const [darkMode, setDarkMode] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Member Management State
  const [memberSearch, setMemberSearch] = useState('');
  const [memberFilter, setMemberFilter] = useState('সব');
  const [editingMember, setEditingMember] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberForm, setMemberForm] = useState({
    name: '',
    role: 'সাধারণ সদস্য',
    bloodGroup: 'O+',
    phone: '',
    profession: '',
    status: 'সক্রিয়'
  });

  // Activity Management State
  const [showActivityModal, setShowActivityModal] = useState(false);
  const [editingActivity, setEditingActivity] = useState(null);
  const [activityForm, setActivityForm] = useState({
    title: '',
    category: 'মানবিক সেবা',
    iconName: 'HeartHandshake',
    date: 'চলমান কার্যক্রম',
    description: '',
    image: 'https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&q=80&w=1000'
  });

  // Notice Management State
  const [showNoticeModal, setShowNoticeModal] = useState(false);
  const [editingNotice, setEditingNotice] = useState(null);
  const [noticeForm, setNoticeForm] = useState({
    title: '',
    category: 'জরুরি ঘোষণা',
    date: '১৮ নভেম্বর, ২০২৬',
    summary: '',
    content: '',
    published: true
  });

  // Gallery Management State
  const [showGalleryModal, setShowGalleryModal] = useState(false);
  const [galleryForm, setGalleryForm] = useState({
    title: '',
    category: 'সামাজিক কার্যক্রম',
    date: '১৮ নভেম্বর, ২০২৬',
    url: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&q=80&w=900'
  });

  const menuItems = [
    { id: 'overview', label: 'ওভারভিউ', icon: LayoutDashboard },
    { id: 'members', label: 'সদস্য ব্যবস্থাপনা', icon: Users },
    { id: 'activities', label: 'কার্যক্রম ব্যবস্থাপনা', icon: HeartHandshake },
    { id: 'notices', label: 'নোটিশ বোর্ড', icon: Bell },
    { id: 'gallery', label: 'গ্যালারি ব্যবস্থাপনা', icon: Images },
    { id: 'applications', label: 'স্বেচ্ছাসেবক আবেদন', icon: UserCheck, badge: applications.filter((a) => a.status === 'pending').length },
    { id: 'settings', label: 'ওয়েবসাইট সেটিংস', icon: Settings }
  ];

  // Theme Classes
  const bgMain = darkMode ? 'bg-[#0b1324] text-white' : 'bg-[#F5F6F7] text-[#17191C]';
  const cardBg = darkMode
    ? 'bg-[#101D35]/90 border-white/10 text-white'
    : 'bg-white/90 border-black/[0.05] text-[#17191C]';
  const inputBg = darkMode
    ? 'bg-[#0b1324] border-white/10 text-white focus:border-[#087F5B]'
    : 'bg-[#F5F6F7] border-transparent text-[#17191C] focus:border-[#087F5B] focus:bg-white';
  const mutedText = darkMode ? 'text-white/60' : 'text-[#858B93]';

  // ---- Member Handlers ----
  const openAddMember = () => {
    setEditingMember(null);
    setMemberForm({
      name: '',
      role: 'সাধারণ সদস্য',
      bloodGroup: 'O+',
      phone: '',
      profession: '',
      status: 'সক্রিয়'
    });
    setShowMemberModal(true);
  };

  const openEditMember = (mem) => {
    setEditingMember(mem);
    setMemberForm(mem);
    setShowMemberModal(true);
  };

  const handleSaveMember = (e) => {
    e.preventDefault();
    if (editingMember) {
      setMembers(members.map((m) => (m.id === editingMember.id ? { ...memberForm, id: m.id } : m)));
      showToast('সদস্যের তথ্য হালনাগাদ করা হয়েছে');
    } else {
      const newMem = {
        ...memberForm,
        id: `MEM-${100 + members.length + 1}`,
        joinDate: new Date().toISOString().slice(0, 10)
      };
      setMembers([newMem, ...members]);
      showToast('নতুন সদস্য যুক্ত করা হয়েছে');
    }
    setShowMemberModal(false);
  };

  const handleDeleteMember = (id) => {
    setMembers(members.filter((m) => m.id !== id));
    showToast('সদস্য তালিকা থেকে মুছে ফেলা হয়েছে');
  };

  // ---- Activity Handlers ----
  const handleSaveActivity = (e) => {
    e.preventDefault();
    if (editingActivity) {
      setActivities(
        activities.map((a) => (a.id === editingActivity.id ? { ...activityForm, id: a.id } : a))
      );
      showToast('কার্যক্রম হালনাগাদ করা হয়েছে');
    } else {
      setActivities([{ ...activityForm, id: `act-${Date.now()}` }, ...activities]);
      showToast('নতুন কার্যক্রম তৈরি করা হয়েছে');
    }
    setShowActivityModal(false);
  };

  // ---- Notice Handlers ----
  const handleSaveNotice = (e) => {
    e.preventDefault();
    if (editingNotice) {
      setNotices(notices.map((n) => (n.id === editingNotice.id ? { ...noticeForm, id: n.id } : n)));
      showToast('নোটিশ হালনাগাদ করা হয়েছে');
    } else {
      setNotices([{ ...noticeForm, id: `not-${Date.now()}` }, ...notices]);
      showToast('নতুন নোটিশ প্রকাশিত হয়েছে');
    }
    setShowNoticeModal(false);
  };

  // ---- Volunteer Application Approval ----
  const handleApplicationStatus = (app, status) => {
    setApplications(applications.map((a) => (a.id === app.id ? { ...a, status } : a)));
    if (status === 'approved') {
      const newMem = {
        id: `MEM-${100 + members.length + 1}`,
        name: app.fullName,
        role: 'স্বেচ্ছাসেবক সদস্য',
        bloodGroup: 'O+',
        phone: app.phone,
        profession: app.profession,
        status: 'সক্রিয়',
        joinDate: new Date().toISOString().slice(0, 10)
      };
      setMembers([newMem, ...members]);
      showToast(`${app.fullName}-কে অনুমোদন ও সদস্য তালিকায় যুক্ত করা হয়েছে!`);
    } else {
      showToast('আবেদনটি বাতিল করা হয়েছে');
    }
  };

  const filteredMembers = members.filter((m) => {
    const matchesSearch =
      m.name.toLowerCase().includes(memberSearch.toLowerCase()) ||
      m.phone.includes(memberSearch) ||
      m.role.includes(memberSearch);
    const matchesFilter = memberFilter === 'সব' || m.status === memberFilter;
    return matchesSearch && matchesFilter;
  });

  return (
    <div className={`min-h-screen flex ${bgMain} transition-colors duration-300`}>
      {/* Sidebar (Desktop & Mobile) */}
      <aside
        className={`fixed inset-y-0 left-0 z-50 w-72 transform transition-transform duration-300 lg:static lg:translate-x-0 ${
          sidebarOpen ? 'translate-x-0' : '-translate-x-full'
        } ${
          darkMode ? 'bg-[#101D35] border-r border-white/10' : 'bg-white border-r border-black/[0.06]'
        } flex flex-col justify-between p-5`}
      >
        <div>
          {/* Sidebar Brand */}
          <div className="flex items-center justify-between mb-8 px-2">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 rounded-full bg-black flex items-center justify-center overflow-hidden flex-none">
                <img src={LOGO_SRC} alt="নাগমুদ আদর্শ যুব ক্রীড়া সংঘের লোগো" className="w-full h-full rounded-full object-cover" />
              </div>
              <div>
                <h2 className="text-sm font-bold leading-tight">অ্যাডমিন প্যানেল</h2>
                <p className={`text-[11px] ${mutedText}`}>নাগমুদ আদর্শ যুব ক্রীড়া সংঘ</p>
              </div>
            </div>
            <button onClick={() => setSidebarOpen(false)} className="lg:hidden p-1.5 rounded-lg">
              <X size={20} />
            </button>
          </div>

          {/* Navigation Menu */}
          <nav className="space-y-1.5">
            {menuItems.map((item) => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    setSidebarOpen(false);
                  }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-medium transition-all ${
                    isActive
                      ? 'bg-[#087F5B] text-white shadow-md shadow-[#087F5B]/20'
                      : darkMode
                      ? 'text-white/75 hover:bg-white/5'
                      : 'text-[#17191C]/80 hover:bg-[#F5F6F7]'
                  }`}
                >
                  <span className="flex items-center gap-3">
                    <Icon size={18} strokeWidth={1.85} />
                    <span>{item.label}</span>
                  </span>
                  {item.badge > 0 && (
                    <span
                      className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                        isActive ? 'bg-white text-[#087F5B]' : 'bg-[#087F5B] text-white'
                      }`}
                    >
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>

        {/* Bottom Actions */}
        <div className="pt-4 border-t border-black/[0.06] space-y-2">
          <button
            onClick={onBackToWebsite}
            className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium transition-colors ${
              darkMode ? 'bg-white/5 hover:bg-white/10 text-white' : 'bg-[#F5F6F7] hover:bg-[#e9ecef] text-[#17191C]'
            }`}
          >
            <Globe size={18} />
            <span>মূল ওয়েবসাইট দেখুন</span>
          </button>
          <button
            onClick={onLogout}
            className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-[#858B93] hover:text-[#17191C] transition-colors"
          >
            <LogOut size={18} />
            <span>লগআউট</span>
          </button>
        </div>
      </aside>

      {/* Main Content Area */}
      <div className="flex-1 flex flex-col min-w-0">
        {/* Top Header */}
        <header
          className={`sticky top-0 z-30 px-4 sm:px-8 py-4 backdrop-blur-xl border-b flex items-center justify-between ${
            darkMode ? 'bg-[#0b1324]/80 border-white/10' : 'bg-white/80 border-black/[0.05]'
          }`}
        >
          <div className="flex items-center gap-3">
            <button
              onClick={() => setSidebarOpen(true)}
              className="lg:hidden p-2 rounded-xl bg-[#F5F6F7] text-[#17191C]"
            >
              <Menu size={20} />
            </button>
            <div>
              <h1 className="text-lg sm:text-xl font-bold">
                {menuItems.find((m) => m.id === activeTab)?.label}
              </h1>
              <p className={`text-xs ${mutedText}`}>
                লাইভ ডেটা সিঙ্ক সক্রিয় — পরিবর্তনসমূহ সাথে সাথে ওয়েবসাইটে প্রতিফলিত হবে
              </p>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <LangToggle dark={darkMode} />
            <button
              onClick={() => setDarkMode(!darkMode)}
              title="থিম পরিবর্তন করুন"
              className={`p-2.5 rounded-full border transition-colors ${
                darkMode ? 'bg-white/10 border-white/10 text-white' : 'bg-[#F5F6F7] border-black/5 text-[#17191C]'
              }`}
            >
              {darkMode ? <Sun size={18} /> : <Moon size={18} />}
            </button>
            <button
              onClick={onBackToWebsite}
              className="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#087F5B] text-white text-xs font-semibold hover:bg-[#06694b] transition-colors"
            >
              <span>লাইভ প্রিভিউ</span>
              <ExternalLink size={14} />
            </button>
          </div>
        </header>

        {/* Dashboard Module Content */}
        {/* Mobile app-style bottom tab bar (admin) */}
        <div className={`tabbar lg:hidden fixed bottom-0 left-0 right-0 z-40 px-3 pt-2 backdrop-blur-2xl border-t ${darkMode ? 'bg-[#101D35]/90 border-white/10' : 'bg-white/85 border-black/[0.06]'}`}>
          <div className="flex items-stretch justify-between max-w-md mx-auto">
            {menuItems.slice(0, 4).map((item) => {
              const TabIcon = item.icon;
              const on = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 ${on ? 'text-[#087F5B]' : mutedText}`}
                >
                  <span className={`px-4 py-1 rounded-full ${on ? 'bg-[#087F5B]/12' : ''}`}><TabIcon size={22} strokeWidth={on ? 2.2 : 1.8} /></span>
                  <span className="text-[10.5px] font-medium leading-tight truncate max-w-[64px]">{item.label}</span>
                </button>
              );
            })}
            <button onClick={() => setSidebarOpen(true)} className={`flex-1 flex flex-col items-center gap-0.5 py-1.5 ${mutedText}`}>
              <span className="px-4 py-1"><Menu size={22} strokeWidth={1.8} /></span>
              <span className="text-[10.5px] font-medium leading-tight">আরও</span>
            </button>
          </div>
        </div>

        <main className="p-4 sm:p-8 pb-28 sm:pb-28 lg:pb-8 max-w-7xl w-full mx-auto space-y-8">
          {/* ==============================================================
              1. OVERVIEW MODULE
          ============================================================== */}
          {activeTab === 'overview' && (
            <>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {[
                  { label: 'মোট নিবন্ধিত সদস্য', value: members.length, icon: Users, sub: `${members.filter((m) => m.status === 'সক্রিয়').length} জন সক্রিয়` },
                  { label: 'চলমান কার্যক্রম', value: activities.length, icon: HeartHandshake, sub: 'মানবিক ও সামাজিক প্রকল্প' },
                  { label: 'প্রকাশিত নোটিশ', value: notices.filter((n) => n.published).length, icon: Bell, sub: `মোট ${notices.length}টি নোটিশ` },
                  { label: 'গ্যালারি ছবি', value: gallery.length, icon: Images, sub: '৫টি ক্যাটাগরিতে সংরক্ষিত' }
                ].map((stat, i) => (
                  <div key={i} className={`p-6 rounded-[24px] border backdrop-blur-xl shadow-sm ${cardBg}`}>
                    <div className="flex items-center justify-between mb-4">
                      <div className="w-11 h-11 rounded-2xl bg-[#087F5B]/10 text-[#087F5B] flex items-center justify-center">
                        <stat.icon size={22} strokeWidth={1.85} />
                      </div>
                      <span className={`text-xs font-medium ${mutedText}`}>লাইভ</span>
                    </div>
                    <p className={`text-sm font-medium ${mutedText}`}>{stat.label}</p>
                    <h3 className="text-3xl font-bold mt-1">{stat.value}</h3>
                    <p className={`text-xs mt-2 ${mutedText}`}>{stat.sub}</p>
                  </div>
                ))}
              </div>

              {/* Recent Volunteer Applications & Contact Messages */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className={`p-6 rounded-[24px] border ${cardBg}`}>
                  <div className="flex items-center justify-between mb-5">
                    <h3 className="text-lg font-bold">সাম্প্রতিক স্বেচ্ছাসেবক আবেদন</h3>
                    <button
                      onClick={() => setActiveTab('applications')}
                      className="text-xs font-semibold text-[#087F5B] hover:underline"
                    >
                      সব দেখুন
                    </button>
                  </div>
                  <div className="space-y-3">
                    {applications.slice(0, 4).map((app) => (
                      <div
                        key={app.id}
                        className={`p-4 rounded-2xl flex items-center justify-between ${
                          darkMode ? 'bg-white/5' : 'bg-[#F5F6F7]'
                        }`}
                      >
                        <div>
                          <h4 className="text-sm font-bold">{app.fullName}</h4>
                          <p className={`text-xs ${mutedText}`}>
                            {app.interest} • {app.phone}
                          </p>
                        </div>
                        <span
                          className={`px-3 py-1 rounded-full text-xs font-semibold ${
                            app.status === 'approved'
                              ? 'bg-[#087F5B]/15 text-[#087F5B]'
                              : app.status === 'rejected'
                              ? 'bg-black/10 text-[#858B93]'
                              : 'bg-[#101D35] text-white'
                          }`}
                        >
                          {app.status === 'approved'
                            ? 'অনুমোদিত'
                            : app.status === 'rejected'
                            ? 'বাতিল'
                            : 'অপেক্ষমান'}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`p-6 rounded-[24px] border ${cardBg}`}>
                  <div className="flex items-center justify-between mb-5">
                    <h3 className="text-lg font-bold">সাম্প্রতিক যোগাযোগ বার্তা ({contactMessages.length})</h3>
                  </div>
                  {contactMessages.length === 0 ? (
                    <div className={`py-10 text-center text-sm ${mutedText}`}>
                      ওয়েবসাইটের যোগাযোগ ফর্ম থেকে পাঠানো বার্তাগুলো এখানে দেখা যাবে।
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {contactMessages.map((msg) => (
                        <div
                          key={msg.id}
                          className={`p-4 rounded-2xl ${darkMode ? 'bg-white/5' : 'bg-[#F5F6F7]'}`}
                        >
                          <div className="flex justify-between text-xs font-semibold mb-1">
                            <span>{msg.name} ({msg.phone})</span>
                            <span className="text-[#087F5B]">{msg.subject}</span>
                          </div>
                          <p className={`text-xs ${mutedText}`}>{msg.message}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </>
          )}
